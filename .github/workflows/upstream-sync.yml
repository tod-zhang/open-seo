name: Upstream sync

# Keeps a fork's main in step with every-app/open-seo. Runs daily (and on
# demand): a conflict-free merge is pushed straight to main; a conflicting one
# opens (or refreshes) a PR from the `upstream-sync` branch so the conflicts
# can be resolved by hand. Inert on the upstream repository itself.
#
# Fork setup: enable Actions, set Settings → Actions → General → Workflow
# permissions to "Read and write" and allow Actions to create pull requests.
# If upstream changes files under .github/workflows/, GITHUB_TOKEN cannot push
# them; add a fine-grained PAT (Contents, Pull requests, Workflows: write) as
# the UPSTREAM_SYNC_TOKEN secret to cover that case.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: every-app/open-seo
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    if: github.repository != 'every-app/open-seo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with ${UPSTREAM_REPO}."
            exit 0
          fi

          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push origin "HEAD:$BASE_BRANCH"
            echo "Merged ${UPSTREAM_REPO}@${upstream_sha} into ${BASE_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
          git merge --abort
          git push --force origin "upstream/$UPSTREAM_BRANCH:refs/heads/$SYNC_BRANCH"

          body=$(printf '%s\n\n%s\n\n%s\n%s\n\n%s\n' \
            "Upstream ${UPSTREAM_REPO}@${upstream_sha} conflicts with \`${BASE_BRANCH}\`, so it was not merged automatically." \
            "Resolve the conflicts below (GitHub's \"Resolve conflicts\" button or locally), then merge this PR with a merge commit." \
            "Conflicting files:" \
            "${conflicts}" \
            "This branch is refreshed by the Upstream sync workflow each run.")

          existing=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "$body"
          else
            gh pr create --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
              --title "Sync upstream ${UPSTREAM_REPO} (conflicts)" --body "$body"
          fi
          echo "Conflicts with ${UPSTREAM_REPO}@${upstream_sha}; opened a PR from ${SYNC_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
